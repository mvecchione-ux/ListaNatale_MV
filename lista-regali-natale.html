<style>
:root{--bg:#eef0ea;--surface:#fbfbf8;--ink:#23262b;--muted:#5d6358;--line:#d5d9cd;--green:#33442f;--gold:#9a7620;--onGreen:#f4f6ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a16;--surface:#20241e;--ink:#eceee6;--muted:#a3aa9a;--line:#343a2f;--green:#9bb88f;--gold:#d3ae55;--onGreen:#14170f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171a16;--surface:#20241e;--ink:#eceee6;--muted:#a3aa9a;--line:#343a2f;--green:#9bb88f;--gold:#d3ae55;--onGreen:#14170f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(2rem,8vw,2.9rem);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 22px;max-width:46ch}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:10px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--green);color:var(--onGreen)}
.tabs button:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h2{font-size:1.05rem;font-weight:600;margin:26px 0 10px;color:var(--muted)}
.item{display:grid;grid-template-columns:112px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.sw{border-radius:10px;aspect-ratio:3/4;overflow:hidden;display:grid;place-items:center;font-size:2rem}
.sw img{width:100%;height:100%;object-fit:cover;display:block}
.item h3{margin:2px 0 2px;font-size:1.05rem;font-weight:600;line-height:1.25}
.meta{margin:0;color:var(--muted);font-size:.9rem}
.note{margin:6px 0 0;font-size:.9rem}
.go{display:inline-block;margin-top:10px;background:var(--green);color:var(--onGreen);text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:999px}
.foot{margin-top:28px;color:var(--muted);font-size:.85rem}
@media (max-width:360px){.item{grid-template-columns:88px 1fr}}
</style>
